name: CI

# Safety gate before main: what merges is what the next deploy ships (DEPLOY.md),
# so a type error or a broken Worker build must be caught on the PR.
# tsc --noEmit needs no secrets/env and reliably catches the common breakage.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

  # The Cloudflare Worker: binding types match wrangler.jsonc, the OpenNext
  # build succeeds and wrangler can bundle it.
  worker:
    name: Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Binding types match wrangler.jsonc
        run: npm run check:cf-types
      - run: npm run build:worker
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir "${{ runner.temp }}/worker-bundle"

  # Vote integrity end to end: builds the app, starts it on a throwaway local
  # database and replays the audit's attacks over HTTP (tests/).
  e2e:
    name: E2E (vote integrity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
