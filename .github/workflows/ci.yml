name: CI

# The gate before main, sized to the change (DEPLOY.md "How a change ships").
# main is the next release, so what merges must be shippable; but a docs fix
# or a nightly list update does not need eight minutes of browser tests.
#
# The first job sorts the pull request's files (scripts/ci-lanes.mjs, which
# follows the site's imports rather than trusting folder names):
#   docs only            nothing else runs
#   code the site never  typecheck, lint and the unit tests
#   imports, workflows
#   data/                the same, plus the Worker build
#   anything the site    everything, with the browser tests
#   reaches, or unknown
# A release pull request changes package.json, so it always runs everything:
# that is the full check on the whole batch before production deploys.
#
# "CI result" is the one check the main ruleset needs to require: it passes
# when every job that ran passed, and fails when one failed or the sorting
# itself broke. A job this file skips reports as skipped, never as missing.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lanes:
    name: Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.lanes.outputs.typecheck }}
      unit: ${{ steps.lanes.outputs.unit }}
      worker: ${{ steps.lanes.outputs.worker }}
      e2e: ${{ steps.lanes.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the pull request's files can be listed
          # against where it left main.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Sort the changed files
        id: lanes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/ci-lanes.mjs --base "origin/$BASE_REF" | tee -a "$GITHUB_OUTPUT"
          else
            # Run by hand: everything.
            node scripts/ci-lanes.mjs --all | tee -a "$GITHUB_OUTPUT"
          fi

  typecheck:
    needs: lanes
    if: needs.lanes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # Next.js's rules (React, hooks, Core Web Vitals, TypeScript); see
      # eslint.config.mjs. Errors fail the PR.
      - name: Lint
        run: npm run lint

  # The tests that need no running site (scripts/test-unit.mjs): no build, no
  # server, no database. The E2E job runs these too, with all the others.
  unit:
    name: Unit tests
    needs: lanes
    if: needs.lanes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The capture's tests (splash gates, dialogs, screenshots) open pages in
      # headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit

  # The Cloudflare Worker: binding types match wrangler.jsonc, the OpenNext
  # build succeeds and wrangler can bundle it.
  worker:
    name: Worker build
    needs: lanes
    if: needs.lanes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Binding types match wrangler.jsonc
        run: npm run check:cf-types
      - run: npm run build:worker
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run --outdir "${{ runner.temp }}/worker-bundle"
      # The staging environment (wrangler.jsonc env.staging) bundles too.
      - name: Bundle the staging Worker
        run: npx wrangler deploy --dry-run --env staging --outdir "${{ runner.temp }}/worker-bundle-staging"
      # The bundle exports every Durable Object and Workflow class wrangler.jsonc
      # binds (the deploy's DOQueueHandler warning is a false alarm; DEPLOY.md).
      - name: Bound classes are exported
        run: node scripts/check-worker-exports.mjs "${{ runner.temp }}/worker-bundle/index.js"

  # End to end: builds the app, starts it on a throwaway local database and a
  # local PageSpeed stand-in, then runs every test in tests/ over HTTP (vote
  # integrity, stale-while-revalidate caching, the prewarm job's exit codes)
  # and in a headless browser (Undo toasts).
  e2e:
    name: E2E
    needs: lanes
    if: needs.lanes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tests/undo-ui.test.mjs drives the app in headless Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The single check to require on main. A skipped job is fine (its lane was
  # not needed); a failed or cancelled one, or a failed sorting, is not.
  result:
    name: CI result
    needs: [lanes, typecheck, unit, worker, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job that ran passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          sorted=$(echo "$RESULTS" | jq -r '.lanes.result')
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ "$sorted" != "success" ]; then
            echo "::error::The changed files could not be sorted, so nothing was checked."
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::Did not pass: $bad"
            exit 1
          fi
