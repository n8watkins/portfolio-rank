name: Ingest portfolios

# Capture + AI-grade any newly-added portfolios, with no laptop required.
# capture.mjs and judge.mjs both SKIP work that's already done (a site with a
# shot_key isn't re-captured; a site with an ai_rubric isn't re-graded), so this
# is safe to run on every trigger and only ever does the *new* work.
on:
  workflow_dispatch: {}            # run on demand from the Actions tab
  push:
    branches: [main]
    paths: ["data/feed.json"]      # a merged PR that adds a portfolio runs it
  schedule:
    - cron: "0 6 * * 1"            # weekly safety net (Mon 06:00 UTC)

# Never let two ingest runs touch the DB at once.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330           # under the 6h cap; a full cold batch is ~2.5h
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # 1) Screenshot any new sites; serve-frames (hero/mobile/full) go to R2,
      #    the motion strips stay on the runner and vanish with it.
      - name: Capture new portfolios
        run: node pipeline/capture.mjs --concurrency 4

      # 2) Grade the freshly-captured sites with Gemini (rubric). The strips it
      #    needs are still on the runner from step 1.
      - name: AI-grade new portfolios
        run: node pipeline/judge.mjs rubric
