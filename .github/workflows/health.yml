name: Weekly health check + cleanup

# PortfolioRank's own cleanup (owner decision 2026-11-10: our list wins, and
# background jobs only work on sites on the current list). Free: no Gemini.
#   1. mark database rows that left data/feed.json as delisted
#   2. check every listed site (loads, not parked, not blank, not a duplicate,
#      not graded "not a portfolio") and advance live -> suspect -> down;
#      down only after 3 failed checks in a row spanning 13+ days
#   3. add newly confirmed-down sites to data/excluded.json (and drop them
#      from data/feed.json) through one bot pull request that auto-merges,
#      same flow as the daily upstream sync
#   4. delete screenshots and rows delisted for 30+ days (votes are kept)
# See pipeline/health.mjs and AUTOMATION.md.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 16 * * 0" # Sundays 16:00 UTC, clear of the daily jobs

concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # file an issue if a scheduled run fails

jobs:
  health:
    # Same pin as sync-upstream: Playwright's Chromium needs ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The pull request step pushes with the bot token, not GITHUB_TOKEN.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Require secrets
        run: |
          missing=
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Check every listed site and exclude confirmed-down ones
        run: node pipeline/health-check.mjs --concurrency 8 --exclusions

      - name: Detect exclusions
        id: excl
        run: |
          if git diff --quiet -- data/excluded.json data/feed.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a bot token
        if: steps.excl.outputs.changed == 'true'
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.SYNC_BOT_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the exclusions pull request
        if: steps.excl.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          BRANCH: data/health-exclusions
        run: |
          added=$(node -e '
            const before = JSON.parse(require("child_process").execSync("git show HEAD:data/excluded.json"));
            const after = require("./data/excluded.json");
            console.log(after.length - before.length);')
          title="chore(data): exclude ${added} confirmed-down portfolio(s) $(date -u +%Y-%m-%d)"
          bot_id=$(gh api "/users/${BOT_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/excluded.json data/feed.json
          git commit -m "$title" -m "Release-note: skip"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          body="Sites the weekly health check confirmed down (3 failed checks in a row over 13+ days) move to data/excluded.json with the reason and the evidence, and out of data/feed.json. They show on /removed once this merges.

          Opened by the [Weekly health check run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}); it squash-merges itself once the required checks pass."
          open=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$title" --body "$body"
            pr="$open"
          else
            url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body "$body")
            pr="${url##*/}"
          fi
          gh pr merge "$pr" --auto --squash --subject "$title (#$pr)" --body ""

      # Runs even when there was nothing to exclude; screenshots of rows
      # delisted for 30+ days go, votes and ratings stay.
      - name: Purge rows delisted for 30+ days
        run: node pipeline/purge-delisted.mjs

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
