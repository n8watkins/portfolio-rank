# An on-demand capture and free checks on a small sample, against staging's
# database, so a changed pipeline step can be proved once before a release
# (DEPLOY.md "Staging"). Run it on the branch with the change:
#   gh workflow run staging-capture.yml --ref <branch> -f sites=20
#
# It runs the code of the ref it was dispatched on, on purpose: not
# the action that pins production's jobs to the last release. It has no schedule.
#
# It cannot touch production: only the STAGING_TURSO_* secrets, no production
# TURSO_*, no GEMINI_API_KEY, and no R2_* secrets. Staging shares production's
# screenshots bucket, so without R2 credentials pipeline/capture.mjs keeps the
# screenshots on disk (and they are thrown away with the runner).
# scripts/staging-capture.mjs guard stops the run when the database does not
# name staging or any of those variables is set.
name: Staging capture

on:
  workflow_dispatch:
    inputs:
      sites:
        description: "How many sites to capture (1 to 100)"
        type: string
        default: "20"

permissions:
  contents: read

concurrency:
  group: staging-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Staging capture
    if: github.repository == 'n8watkins/portfolio-rank'
    # Pinned like grade.yml: Playwright can't install Chromium on ubuntu 26.04 yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STAGING_TURSO_DATABASE_URL: ${{ secrets.STAGING_TURSO_DATABASE_URL }}
      # The pipeline reads TURSO_*: here they are staging's.
      TURSO_DATABASE_URL: ${{ secrets.STAGING_TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.STAGING_TURSO_AUTH_TOKEN }}
      SITES: ${{ inputs.sites }}
    steps:
      - name: Check the input and the secrets
        run: |
          if ! [[ "$SITES" =~ ^[0-9]+$ ]] || [ "$SITES" -lt 1 ] || [ "$SITES" -gt 100 ]; then
            echo "::error::sites must be a whole number from 1 to 100 (got '$SITES')"
            exit 1
          fi
          if [ -z "$STAGING_TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error::The STAGING_TURSO_DATABASE_URL and STAGING_TURSO_AUTH_TOKEN secrets are missing (DEPLOY.md \"Staging\")."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Before anything runs: refuse unless the database names staging and no
      # R2_*, production database or Gemini key is in the environment.
      - name: Refuse to run against anything but staging
        run: node scripts/staging-capture.mjs guard

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # --force: the first N listed sites whether or not a capture is due, so a
      # changed step is tried on sites that already have one. R2 is off, so
      # nothing is uploaded.
      - name: Capture the sample
        run: |
          set -o pipefail
          node pipeline/capture.mjs --force --limit "$SITES" --concurrency 2 | tee capture.log

      # The free checks: page text, facts and project links, plain HTTP and a
      # browser, no Gemini.
      - name: Free checks
        run: node pipeline/evidence.mjs --limit "$SITES" --links "$SITES"

      - name: Summary
        if: always()
        run: |
          if [ -f capture.log ]; then
            node scripts/staging-capture.mjs summary capture.log >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No capture ran: see the step log." >> "$GITHUB_STEP_SUMMARY"
          fi
