name: AI comparisons (manual fallback)

# Manual only since 2026-11-10: AI ranking comparisons run in Cloudflare's
# end-of-day run (pipeline/night.mjs, when the Worker var RANKING_V2 is
# "true"), on what is left of the day's quota after people. This is the hand
# run of the same ranking v2 comparisons on gemini-3.5-flash-lite (budgets
# from RANKING_BUDGET), then the People, AI and Merged boards rebuilt. Its
# steps run only when the repository variable RANKING_V2 is "true"; without
# it a run does nothing. The comparisons ask the budget accountant
# (pipeline/budget.mjs) how much they may spend, so a manual run never takes
# the reserve kept for people.
#
# The ELO-era AI votes (pipeline/judge.mjs pairwise) that ran here without
# RANKING_V2 were removed by the owner on 2026-11-21.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code to run: empty for production's release, checkout for this branch, or one vX.Y.Z tag"
        required: false

# Shares the "gemini" group with sync-upstream (which grades), so comparisons
# and grading never run at the same time and never split the pace or the quota.
concurrency:
  group: gemini
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # file a failure issue

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SHOTS_BASE_URL: ${{ secrets.SHOTS_BASE_URL }} # public R2 base, e.g. https://pub-xxxx.r2.dev
    steps:
      - uses: actions/checkout@v7
      # Production runs the last release's code (.github/actions/release-code).
      - uses: ./.github/actions/release-code
        with:
          code: ${{ inputs.code }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Fail loudly on any missing secret - otherwise the comparisons silently
      # fall back (no R2 screenshots, or a local sqlite file that doesn't
      # exist) and compare nothing on a green run.
      - name: Require secrets
        run: |
          missing=
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN GEMINI_API_KEY SHOTS_BASE_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      # Ranking v2, off until the owner sets RANKING_V2 to "true": the day's
      # one-on-one and batched comparisons on gemini-3.5-flash-lite only
      # (budgets from RANKING_BUDGET, default 100 + 100), then the People, AI
      # and Merged boards rebuilt from every stored comparison.
      - name: Daily AI comparisons (ranking v2)
        if: vars.RANKING_V2 == 'true'
        env:
          GEMINI_BUDGET: ${{ vars.GEMINI_BUDGET }}
          RANKING_V2: ${{ vars.RANKING_V2 }}
          RANKING_BUDGET: ${{ vars.RANKING_BUDGET }}
          RANKING_BATCHED_COUNTS: ${{ vars.RANKING_BATCHED_COUNTS }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '8' }}
          GEMINI_DAILY_QUOTA: ${{ vars.GEMINI_DAILY_QUOTA }}
          GEMINI_PRICES: ${{ vars.GEMINI_PRICES }}
        run: node pipeline/compare.mjs

      - name: Rebuild the boards (ranking v2)
        if: vars.RANKING_V2 == 'true' && !cancelled()
        env:
          RANKING_BATCHED_COUNTS: ${{ vars.RANKING_BATCHED_COUNTS }}
          RANKING_AI_WEIGHT: ${{ vars.RANKING_AI_WEIGHT }}
        run: node scripts/recompute-ratings.mjs

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
