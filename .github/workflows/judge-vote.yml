name: AI votes and comparisons (manual fallback)

# Manual only since 2026-11-10: AI ranking comparisons run in Cloudflare's
# end-of-day run (pipeline/night.mjs, when the Worker var RANKING_V2 is
# "true"), on what is left of the day's quota after people. The ELO-era AI
# votes below no longer run on a schedule; run them by hand if needed. Both
# steps ask the budget accountant (pipeline/budget.mjs) how much they may
# spend, so a manual run never takes the reserve kept for people.

# Each day, gemini-3.5-flash-lite (only: no fallback to a lower model; when
# 3.5 stays busy after its retries or its daily quota is used up, the rest
# waits for the next run; see AUTOMATION.md) compares pairs of higher-tier
# portfolios using
# the R2 hero image + cached objective metrics (PSI/Lighthouse + inspect polish)
# and casts ELO-moving votes, concentrating on graded S/A/B sites so the
# leaderboard (/top lists sites with 1+ vote) fills. Only sites on the current
# list, not confirmed down and not graded "not a portfolio" are paired.
# Heroes come from the public R2 bucket (no local captures on the runner).
# Write-light: one votes row + one ELO upsert per vote, in a short transaction.
# judge.mjs exits 1 (and this job files an issue) when there was work and no
# vote was cast, or when most pairs had to be skipped for missing screenshots.
#
# Budget: shares the free-tier Gemini quota with sync-upstream's rubric grading
# (whose 3.5 grading budget, GEMINI_GRADING_BUDGET, leaves room for this job). Cron is set
# clear of sync's 06:00-11:30 window; both jobs share the "gemini"
# concurrency group, so they never overlap (a queued run waits, it doesn't
# time out: timeout-minutes counts from when the job starts).
on:
  workflow_dispatch:
    inputs:
      votes:
        description: "Max votes this run"
        required: false
        default: "30"
      tiers:
        description: "Comma-separated tiers to concentrate on"
        required: false
        default: "S,A,B"

# Shares the "gemini" group with sync-upstream (which grades), so voting and
# grading never run at the same time and never split the pace or the quota.
concurrency:
  group: gemini
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # file a failure issue

jobs:
  vote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SHOTS_BASE_URL: ${{ secrets.SHOTS_BASE_URL }} # public R2 base, e.g. https://pub-xxxx.r2.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Fail loudly on any missing secret - otherwise judge.mjs silently falls
      # back (no R2 heroes, or a local sqlite file that doesn't exist) and casts
      # 0 votes on a green run.
      - name: Require secrets
        run: |
          missing=
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN GEMINI_API_KEY SHOTS_BASE_URL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      # Ranking v2 (RANKING.md) replaces this step when the repository
      # variable RANKING_V2 is "true"; until then this step runs as before.
      - name: Cast daily AI pairwise votes
        if: vars.RANKING_V2 != 'true'
        env:
          GEMINI_BUDGET: ${{ vars.GEMINI_BUDGET }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '8' }}
          GEMINI_DAILY_QUOTA: ${{ vars.GEMINI_DAILY_QUOTA }}
          GEMINI_PRICES: ${{ vars.GEMINI_PRICES }}
          # Pinned, not a repository variable: votes move ratings, so they
          # come from 3.5 only; the 3.1 fallback is for experiments.
          GEMINI_FALLBACK: "off"
          # Inputs reach the shell as variables, never pasted into the script.
          VOTES: ${{ github.event.inputs.votes || '30' }}
          TIERS: ${{ github.event.inputs.tiers || 'S,A,B' }}
        run: >-
          node pipeline/judge.mjs pairwise
          --votes "$VOTES"
          --tiers "$TIERS"

      # Ranking v2, off until the owner sets RANKING_V2 to "true": the day's
      # one-on-one and batched comparisons on gemini-3.5-flash-lite only
      # (budgets from RANKING_BUDGET, default 100 + 100), then the People, AI
      # and Merged boards rebuilt from every stored comparison.
      - name: Daily AI comparisons (ranking v2)
        if: vars.RANKING_V2 == 'true'
        env:
          GEMINI_BUDGET: ${{ vars.GEMINI_BUDGET }}
          RANKING_V2: ${{ vars.RANKING_V2 }}
          RANKING_BUDGET: ${{ vars.RANKING_BUDGET }}
          RANKING_BATCHED_COUNTS: ${{ vars.RANKING_BATCHED_COUNTS }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '8' }}
          GEMINI_DAILY_QUOTA: ${{ vars.GEMINI_DAILY_QUOTA }}
          GEMINI_PRICES: ${{ vars.GEMINI_PRICES }}
        run: node pipeline/compare.mjs

      - name: Rebuild the boards (ranking v2)
        if: vars.RANKING_V2 == 'true' && !cancelled()
        env:
          RANKING_BATCHED_COUNTS: ${{ vars.RANKING_BATCHED_COUNTS }}
          RANKING_AI_WEIGHT: ${{ vars.RANKING_AI_WEIGHT }}
        run: node scripts/recompute-ratings.mjs

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
