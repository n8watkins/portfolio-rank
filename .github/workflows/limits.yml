name: Free limits snapshot

# Measures the account-wide free allowances (Turso rows read, written and
# storage; R2 storage and operations; Workers requests and CPU time) and
# stores them for /admin/limits (scripts/limits-snapshot.mjs,
# lib/admin/limits.mjs). A source whose
# credentials are missing or refused is skipped and logged; the page then
# shows that row as not measured, or the last measurement with its date. A
# skipped source is a warning on the run (annotation and summary); a run that
# measured nothing at all fails, and the notice below files an issue.
# It also checks the backups are still being written (scripts/check-backup-fresh.mjs):
# nothing else notices a backup run that never started.
#   TURSO_PLATFORM_TOKEN  a Turso platform API token (not a database token)
#   TURSO_ORG             the Turso organization slug (a repository variable)
#   CLOUDFLARE_API_TOKEN  needs Account Analytics Read and R2 read for these numbers
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code to run: empty for production's release, checkout for this branch, or one vX.Y.Z tag"
        required: false
  schedule:
    - cron: "30 13 * * *" # daily 13:30 UTC, early morning Pacific

concurrency:
  group: limits
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TURSO_PLATFORM_TOKEN: ${{ secrets.TURSO_PLATFORM_TOKEN }}
      TURSO_ORG: ${{ vars.TURSO_ORG }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      # Production runs the last release's code (.github/actions/release-code).
      - uses: ./.github/actions/release-code
        with:
          code: ${{ inputs.code }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/limits-snapshot.mjs
      # Runs even when a snapshot step failed, so one failure hides nothing.
      # The scripts are the last release's (release-code above): until a
      # release that has this one is deployed the file is missing and the
      # step is skipped rather than failing.
      - name: Backups are fresh
        if: ${{ !cancelled() && hashFiles('scripts/check-backup-fresh.mjs') != '' }}
        run: node scripts/check-backup-fresh.mjs

  # A job that fails, is cancelled or times out ends its own later steps, and
  # `if: failure()` is false for a cancelled or timed-out job (sync run
  # 43677044060 was cancelled at its 330-minute limit and filed nothing). So
  # the notice is a job of its own: always() runs it whatever happened to the
  # jobs it needs, and it reads their results.
  notify-failure:
    needs: [snapshot]
    if: ${{ always() && (needs.snapshot.result == 'failure' || needs.snapshot.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: 'snapshot: ${{ needs.snapshot.result }}'
    steps:
      - name: File or update the failure issue
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again ($RESULTS): $url"
          else
            gh issue create --title "$title" --body "A scheduled run did not finish ($RESULTS): $url" >/dev/null
          fi
