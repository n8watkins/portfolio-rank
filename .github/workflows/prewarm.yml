name: Prewarm metrics

# Measure Lighthouse and fill the polish cache for every graded portfolio
# (whatever Gemini's letter), so check points and comparisons have objective
# metrics. Lighthouse is measured here, directly: the job calls Google PageSpeed
# from the runner (needs the PSI_API_KEY secret) and writes the results to Turso;
# a page view never measures. The polish check goes through the prod API.
# PSI quota is 25k/day. A full measure is four runs (two phone, two desktop,
# averaged per device), so 400 sites are at most 1,600 runs, about 3 hours with
# three sites at a time (lib/psi-pacing.mjs). The job runs the last release's
# code (below), so a change here starts only with the next release.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code to run: empty for production's release, checkout for this branch, or one vX.Y.Z tag"
        required: false
      limit:
        description: "Max sites to prewarm this run"
        required: false
        default: "400"
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC - clear of sync (06:00) and vote (13:00)

concurrency:
  group: prewarm
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # The site whose API it calls (repository variable; unset,
      # scripts/prewarm-metrics.mjs uses https://portfoliorank.dev).
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      # Production runs the last release's code (.github/actions/release-code).
      - uses: ./.github/actions/release-code
        with:
          code: ${{ inputs.code }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prewarm PSI + inspect caches
        # Inputs reach the shell as variables, never pasted into the script.
        env:
          LIMIT: ${{ github.event.inputs.limit || '400' }}
          # The Google PageSpeed key: only this step has it (not the job, not `npm ci`). The job calls PageSpeed
          # itself and writes the results to Turso; the app's own secrets (AUTH_SECRET) are never given to it.
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          # The wait between a device's two runs. Set here as well as in lib/psi-pacing.mjs because this job runs
          # the released code with this file from main: release v0.10.0 still has the 30 s default, at which
          # PageSpeed sometimes hands the same run back. Remove once a release has the 60 s default.
          PSI_RUN_GAP_MS: "60000"
        run: node scripts/prewarm-metrics.mjs --limit="$LIMIT"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
