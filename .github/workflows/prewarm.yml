name: Prewarm metrics

# Measure Lighthouse and fill the polish cache for every graded portfolio
# (whatever Gemini's letter), so check points and comparisons have objective
# metrics. Lighthouse is measured here, directly: the job calls Google PageSpeed
# from the runner (needs the PSI_API_KEY secret) and writes the results to Turso;
# a page view never measures. The polish check goes through the prod API.
# PSI quota is 25k/day. A full measure is four runs (two phone, two desktop,
# averaged per device), so 400 sites are at most 1,600 runs, about 3 hours with
# three sites at a time (lib/psi-pacing.mjs). The job runs the last release's
# code (below), so a change here starts only with the next release.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code to run: empty for production's release, checkout for this branch, or one vX.Y.Z tag"
        required: false
      limit:
        description: "Max sites to prewarm this run"
        required: false
        default: "400"
  schedule:
    # The fallback (see fallback-guard). The Worker starts the job at about
    # 09:15 UTC; GitHub then starts this whenever it gets to it, and it skips.
    - cron: "0 9 * * *"

concurrency:
  group: prewarm
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # The GitHub schedule is only the fallback: GitHub starts it 7 to 12 hours late,
  # so the Worker's hourly cron starts this workflow with a workflow_dispatch at
  # about 09:15 UTC (worker/prewarm-start.ts, no inputs: the defaults below apply).
  # A scheduled run skips when a dispatched run already started this UTC day
  # (one that succeeded or is still going), so a full run's 1,600 PageSpeed calls
  # are never spent twice; it only does the work when Cloudflare could not (no
  # GITHUB_DISPATCH_TOKEN, a refused dispatch, or the Worker is down).
  fallback-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: prewarm.yml
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u +%Y-%m-%dT00:00:00Z)
          # Only a run that succeeded or is still going counts: a run that
          # failed, was cancelled or timed out did not do the day's work.
          # A list GitHub will not give counts as none: the fallback then runs,
          # which is the safe side when Cloudflare may be down.
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?event=workflow_dispatch&created=%3E%3D$since&per_page=100" \
            --jq '[.workflow_runs[] | select(.status != "completed" or .conclusion == "success")] | length') || n=0
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::A dispatched run of $WORKFLOW already started today (UTC); the GitHub schedule (fallback) skips."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No run of $WORKFLOW was started from Cloudflare today (UTC); the GitHub schedule runs it."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  prewarm:
    needs: fallback-guard
    if: needs.fallback-guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # The site whose API it calls (repository variable; unset,
      # scripts/prewarm-metrics.mjs uses https://portfoliorank.dev).
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      # Production runs the last release's code (.github/actions/release-code).
      - uses: ./.github/actions/release-code
        with:
          code: ${{ inputs.code }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prewarm PSI + inspect caches
        # Inputs reach the shell as variables, never pasted into the script.
        env:
          LIMIT: ${{ github.event.inputs.limit || '400' }}
          # The Google PageSpeed key: only this step has it (not the job, not `npm ci`). The job calls PageSpeed
          # itself and writes the results to Turso; the app's own secrets (AUTH_SECRET) are never given to it.
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: node scripts/prewarm-metrics.mjs --limit="$LIMIT"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
