name: Sync upstream + ingest

# The nightly free checks, the first part of the end-of-day run (owner
# decisions 2026-11-10; AUTOMATION.md "End of day"). No Gemini:
#   1. rebuild feed.json from emmabostian/developer-portfolios' merged README
#      (trust gate = "Emma merged it"; open PRs are NOT pulled),
#   2. if upstream actually changed, open (or refresh) one pull request with it
#      and let it auto-merge once the required checks pass,
#   3. screenshot whatever is new, re-capture the sites whose screenshots are
#      due (--refresh: the page changed, someone asked, or 90 days old; see
#      AUTOMATION.md "When checks re-run"), add tall page images to a
#      capped number of older captures (pipeline/fullpage-backfill.mjs),
#      measure page text and facts for
#      rows waiting for a grade, check again the project links that are due
#      (--links: changed, asked for, or 30 days old), and record page
#      fingerprint changes.
# Cloudflare's end-of-day Workflow starts this at 20:30 Pacific and waits for
# it, then grades new and changed sites on Cloudflare the same night
# (pipeline/night.mjs). capture.mjs reads feed.json, marks database rows that
# left it as delisted (pipeline/roster.mjs), and captures new sites plus
# failed captures whose retry date has come. The feed may shrink by at most
# 5% per run (generate_feed.py --max-shrink).
# Grading here is the fallback only: by hand (the "grade" input), or when the
# GitHub schedule runs because Cloudflare did not start this workflow.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Most sites to re-capture: changed or asked for first, then captures 90 days old (finds redesigns)"
        required: false
        default: "150"
      fullpage_backfill:
        description: "Most sites to give tall page images that have none (pipeline/fullpage-backfill.mjs)"
        required: false
        default: "100"
      rubric_regrade:
        description: "Also measure evidence for grades from an older rubric (the Worker's RUBRIC_REGRADE)"
        required: false
        default: "false"
      grade:
        description: "Also AI-grade here (manual fallback; the end-of-day run on Cloudflare grades every night)"
        type: boolean
        required: false
        default: false
  # Fallback only: skips when Cloudflare started this in the last 20 hours
  # (the fallback-guard job). 06:00 UTC is after Cloudflare's 03:30/04:30.
  schedule:
    - cron: "0 6 * * *"

# One group for every job that calls Gemini (this one grades, judge-vote
# votes): they never run at the same time, so the shared per-minute pace and
# the daily quota are never split between two runs. Also serializes the
# DB-writing sync runs.
concurrency:
  group: gemini
  cancel-in-progress: false

# main requires checks, so the refreshed feed.json lands through a pull request
# opened by the release-kit bot (a GitHub App): its pull requests trigger CI,
# unlike GITHUB_TOKEN's, and GitHub's auto-merge merges it once checks pass.
permissions:
  contents: read
  issues: write # file an issue if a scheduled run fails

jobs:
  # The GitHub schedule is only the fallback: Cloudflare's end-of-day run
  # (worker/night.ts) starts this workflow at 20:30 Pacific with a
  # workflow_dispatch, because GitHub's schedule starts hours late. A
  # scheduled run skips when a dispatched run started in the last WINDOW
  # hours, so it only does the work when Cloudflare could not (no
  # GITHUB_DISPATCH_TOKEN, or the Worker is down).
  fallback-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          WORKFLOW: sync-upstream.yml
          WINDOW: "20"
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          since=$(date -u -d "$WINDOW hours ago" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?event=workflow_dispatch&created=%3E%3D$since" --jq '.total_count')
          if [ "${n:-0}" -gt 0 ]; then
            echo "::notice::Cloudflare's end-of-day run already started $WORKFLOW in the last $WINDOW hours; the GitHub schedule (fallback) skips."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No run started by Cloudflare in the last $WINDOW hours; the GitHub schedule runs as the fallback."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: fallback-guard
    if: needs.fallback-guard.outputs.run == 'true'
    # Pinned: ubuntu-latest moved to 26.04 on 2026-10-22, and Playwright 1.60
    # can't install Chromium there ("does not support chromium on
    # ubuntu26.04-x64"), so capture failed and new portfolios got no screenshots
    # or grades. Unpin once Playwright is upgraded to a version that supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      HAS_PAT: ${{ secrets.GH_SYNC_TOKEN != '' }}
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # The public images bucket (pipeline/shot-store.mjs); empty until the owner creates it.
      R2_IMAGES_BUCKET: ${{ secrets.R2_IMAGES_BUCKET }}
      # "false" stops uploading hero.jpg and mobile.jpg once nothing reads them (docs/audits/fullpage-images.md).
      CAPTURE_LEGACY_FRAMES: ${{ vars.CAPTURE_LEGACY_FRAMES || 'true' }}
      SHOTS_BASE_URL: ${{ secrets.SHOTS_BASE_URL }} # lets rubric grade backlog from R2
    steps:
      - uses: actions/checkout@v7
        with:
          # The sync step pushes with the bot token, not GITHUB_TOKEN.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # 0) Sites the owner confirmed as portfolios on /admin/review (or the
      #    review queue applied as passes) that are off the list go into
      #    data/additions.json first (pipeline/review-additions.mjs), so they
      #    are listed again within a day rather than with the weekly health run.
      - name: Add owner-confirmed relists
        run: node pipeline/review-additions.mjs

      # 1) Rebuild feed.json from upstream's merged (accepted) README.
      - name: Rebuild feed.json from upstream
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/emmabostian/developer-portfolios/master/README.md \
            -o /tmp/upstream-README.md
          # --max-shrink: a truncated or broken upstream README fails the run
          # here instead of dropping hundreds of sites from the list.
          python3 pipeline/generate_feed.py /tmp/upstream-README.md data/feed.json \
            --exclude data/excluded.json --add data/additions.json --max-shrink 0.05

      # 2) Keep your fork mirror current too - only if a PAT is provided.
      - name: Sync fork mirror (optional)
        if: env.HAS_PAT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: |
          gh repo sync n8watkins/developer-portfolios \
            --source emmabostian/developer-portfolios || true

      # 3) If upstream changed something, put feed.json on the data/sync-upstream
      #    branch (force-updated from main each run) and open or refresh one
      #    pull request that squash-merges itself once the required checks pass.
      - name: Detect feed.json change
        id: feed
        run: |
          if git diff --quiet -- data/feed.json data/additions.json data/excluded.json; then
            echo "feed.json unchanged - nothing new upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.SYNC_BOT_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the sync pull request
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          CHANGED: ${{ steps.feed.outputs.changed }}
          BRANCH: data/sync-upstream
        run: |
          open=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ "$CHANGED" != "true" ]; then
            # main already matches upstream, so an older unmerged sync is stale.
            if [ -n "$open" ]; then
              gh pr close "$open" --delete-branch --comment "Superseded: main already matches upstream."
            fi
            exit 0
          fi
          title="chore(data): sync upstream portfolios $(date -u +%Y-%m-%d)"
          bot_id=$(gh api "/users/${BOT_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${BOT_SLUG}[bot]"
          git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/feed.json data/additions.json data/excluded.json
          git commit -m "$title"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          body="Daily refresh of data/feed.json from emmabostian/developer-portfolios (merged README).

          Opened by the [Sync upstream + ingest run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}); it squash-merges itself once the required checks pass."
          if [ -n "$open" ]; then
            gh pr edit "$open" --title "$title" --body "$body"
            pr="$open"
          else
            url=$(gh pr create --base main --head "$BRANCH" --title "$title" --body "$body")
            pr="${url##*/}"
          fi
          gh pr merge "$pr" --auto --squash --subject "$title (#$pr)" --body ""

      # 4) Screenshot + AI-grade the new entries (both no-op on already-done work).
      #    Grading self-limits to sites whose captures exist on this runner - i.e.
      #    the ones just captured above - so it never burns budget re-scanning old
      #    sites or the backlog handled elsewhere.
      - run: npx playwright install --with-deps chromium
      - name: Capture new portfolios, re-capture the due ones
        env:
          REFRESH: ${{ inputs.refresh || '150' }}
        run: node pipeline/capture.mjs --concurrency 4 --refresh "$REFRESH"
      # Tall desktop and phone images with thumbnails (AVIF, for the report
      # card's preview) for sites captured before the capture made them, a
      # capped number a night (pipeline/fullpage-backfill.mjs); the capture
      # above makes them for every site it captures. Changes no grade,
      # hero.jpg or capture date. Does nothing until the images bucket
      # exists (R2_IMAGES_BUCKET). About 20 seconds a site at concurrency 4,
      # so 100 sites take about 33 minutes; no new site starts after 40.
      - name: Backfill tall page images
        env:
          FULLPAGE_BACKFILL: ${{ inputs.fullpage_backfill || '100' }}
        run: node pipeline/fullpage-backfill.mjs --concurrency 4 --limit "$FULLPAGE_BACKFILL" --minutes 40
      # Page text and facts for rows waiting for a grade that have none
      # (captured before rubric v2): the end-of-day grading on Cloudflare
      # reads only stored evidence. Then the project link checks that are
      # due (about 70 a night: the list over 30 days, plus changed sites).
      - name: Measure page evidence for the grading queue, re-check due links
        env:
          RUBRIC_REGRADE: ${{ inputs.rubric_regrade || vars.RUBRIC_REGRADE || 'false' }}
        run: node pipeline/evidence.mjs --limit 300 --links 120
      # Fingerprint changes become "Grade changed sites" tonight.
      - name: Record page changes
        run: node scripts/detect-changes.mjs
      # Fallback only (the "grade" input, or a scheduled run because
      # Cloudflare did not start this one): grades needs_review and
      # newest-captured sites first, then the backlog, then re-grades, inside
      # the budget accountant's shares (pipeline/budget.mjs). Grades come
      # from gemini-3.5-flash-lite only (owner, 2026-11-10).
      - name: AI-grade new + backlog (fallback)
        if: inputs.grade == true || github.event_name == 'schedule'
        env:
          GEMINI_RPM: ${{ vars.GEMINI_RPM || '8' }}
          GEMINI_DAILY_QUOTA: ${{ vars.GEMINI_DAILY_QUOTA }}
          GEMINI_BUDGET: ${{ vars.GEMINI_BUDGET }}
          # Pinned, not a repository variable: the 3.1 fallback is for
          # labelled experiments only and never grades production sites.
          GEMINI_FALLBACK: "off"
          GEMINI_PRICES: ${{ vars.GEMINI_PRICES }}
          # Re-grade 3.5 grades from an older rubric version, lowest priority
          # (pipeline/rubric.mjs). Off until the owner sets it to "true".
          RUBRIC_REGRADE: ${{ vars.RUBRIC_REGRADE || 'false' }}
        run: node pipeline/judge.mjs rubric --limit 1000

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
