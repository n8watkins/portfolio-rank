name: Discover portfolios

# The discovery pipeline (docs/DISCOVERY.md, pipeline/discovery/run.mjs):
# reads each source that is due from its watermark (GitHub topics and Hacker
# News weekly, the "Share your personal site" threads monthly,
# personalsit.es and uses.tech when they change), checks the new sites for
# free with code, and, when switched on, hands the ones that pass to the
# grader's queue at a capped pace. No AI screen: Gemini is asked about a site
# once, when it is graded (owner, 2026-11-22).
#
# Daily, so the hand-off keeps an even pace inside its daily cap; each source
# is still read only when its interval is due.
# 22:00 UTC is the Pacific afternoon, clear of the 20:30 to 21:15 Pacific
# nightly window.
#
# Every automated run is off until the owner turns it on: the schedule needs
# the repository variable DISCOVERY_SCHEDULE=on (else each daily run is skipped
# at once, without a runner).
#
# Target: the production database, and only when the repository variable
# DISCOVERY_TARGET is "production" (the owner's word); without it every run
# stops at its first step and writes nothing. There is no other database since
# staging was removed (docs/DECISIONS.md, 2026-11-22). Switch (a repository
# variable, off until the owner turns it on): DISCOVERY_HANDOFF=on (grading). DISCOVERY_CAPS (JSON) lowers or raises the
# caps in pipeline/discovery/run.mjs.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code to run: empty for production's release, checkout for this branch, or one vX.Y.Z tag"
        required: false
      sources:
        description: "Sources to read: all, none, or a comma list (github:portfolio,hn:hired,uses,...)"
        required: false
        default: "all"
      caps:
        description: "Caps for this run as JSON, over DISCOVERY_CAPS (for example {\"found\":50})"
        required: false
        default: ""
  schedule:
    - cron: "0 22 * * *"

# One discovery run at a time: two would read the same sources and queues.
concurrency:
  group: discovery
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # file an issue if a scheduled run fails

jobs:
  discover:
    # Off by default: the daily schedule runs only once the repository variable
    # DISCOVERY_SCHEDULE is "on" (owner); a manual run (workflow_dispatch) always runs.
    if: github.event_name == 'workflow_dispatch' || vars.DISCOVERY_SCHEDULE == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TARGET: ${{ vars.DISCOVERY_TARGET == 'production' && 'production' || 'none' }}
      TURSO_DATABASE_URL: ${{ vars.DISCOVERY_TARGET == 'production' && secrets.TURSO_DATABASE_URL || '' }}
      TURSO_AUTH_TOKEN: ${{ vars.DISCOVERY_TARGET == 'production' && secrets.TURSO_AUTH_TOKEN || '' }}
      # GitHub search (30 a minute) and the owners' profiles (GraphQL).
      GITHUB_TOKEN: ${{ github.token }}
      DISCOVERY_HANDOFF: ${{ vars.DISCOVERY_HANDOFF || 'off' }}
      DISCOVERY_CAPS: ${{ inputs.caps || vars.DISCOVERY_CAPS }}
      GRADER_CAPS: ${{ vars.GRADER_CAPS }}
    steps:
      - name: Check the target
        run: |
          if [ "$TARGET" != "production" ]; then
            echo "::error::Discovery writes to the production database only when the repository variable DISCOVERY_TARGET is \"production\" (the owner's word). Nothing was run."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Production runs the last release's code (.github/actions/release-code).
      - uses: ./.github/actions/release-code
        with:
          code: ${{ inputs.code }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover (${{ env.TARGET }})
        env:
          SOURCES: ${{ inputs.sources || 'all' }}
        run: node pipeline/discovery/run.mjs --sources "$SOURCES" --summary "$RUNNER_TEMP/discovery.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: discovery-summary
          path: ${{ runner.temp }}/discovery.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
