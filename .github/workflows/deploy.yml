# Builds PortfolioRank with OpenNext and ships it to production
# (https://portfoliorank.dev), then smoke checks it (scripts/smoke.mjs).
#
# Production is the last release, never main (DEPLOY.md "How a change ships"):
#   - a release tag (npm run release -- --push) deploys that release;
#   - a change to data/ on main (the nightly list sync, a removal) rebuilds
#     the last release's code over the new data, because pages import the
#     list into the build. No unreleased code goes out with it.
#   - "Run workflow" deploys the last release again, or one older tag to go
#     back to it.
# A merge to main that changes code reaches staging only (staging.yml).
# The deploy skips with a notice until the CLOUDFLARE_API_TOKEN secret exists.
name: Deploy

on:
  push:
    tags: ["v[0-9]*"]
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:
    inputs:
      code:
        description: "release (the last release again), or one vX.Y.Z tag to go back to"
        required: false
        default: "release"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.repository == 'n8watkins/portfolio-rank'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The home page is prerendered at build time (and kept fresh by ISR), so
      # the build reads the database and links screenshots like the live site.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Pages link captures on our own domain (wrangler.jsonc vars).
      SHOTS_BASE_URL: /shots
      # Browser errors go to Sentry (lib/error-reporting.ts). Only the deploy
      # builds set the DSN, so local, CI and test builds send nothing.
      NEXT_PUBLIC_SENTRY_DSN: https://524f3d71051d8ad12f3dafce965d0ed4@o4507767562371072.ingest.us.sentry.io/4512375298523136
      # Readable browser stack traces in Sentry: with the SENTRY_AUTH_TOKEN
      # secret and the SENTRY_ORG / SENTRY_PROJECT repository variables set,
      # the build emits source maps, uploads them and deletes them before the
      # deploy. Without them, nothing changes.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      # Unreleased code is never deployed from here; staging has it.
      - name: Refuse to deploy unreleased code
        if: inputs.code == 'checkout'
        run: |
          echo "::error::Production deploys a release. Cut one with npm run release -- --push (RELEASING.md)."
          exit 1

      # main for its data/; the code comes from the release in the next step.
      - uses: actions/checkout@v7
        with:
          ref: main

      # The pushed tag, the tag asked for, or the last release. Until the
      # first release tag exists this keeps main's code, as before.
      - id: code
        uses: ./.github/actions/release-code
        with:
          code: ${{ github.ref_type == 'tag' && github.ref_name || inputs.code || 'release' }}

      # Sentry groups errors by the code's commit, not the data's.
      - name: Name the build
        env:
          CODE_SHA: ${{ steps.code.outputs.sha }}
        run: echo "NEXT_PUBLIC_SENTRY_RELEASE=$CODE_SHA" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The data can be newer than the code reading it. This is the released
      # code's own check of what it can read (scripts/check-data.mjs); when it
      # fails nothing is deployed and the site stays as it was.
      - name: Check the data fits this code
        run: node scripts/check-data.mjs

      # Additive schema changes (lib/schema.mjs) land before the code that
      # needs them (and before the build prerenders from the database),
      # instead of on a live request.
      - name: Migrate the database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.TURSO_DATABASE_URL != ''
        run: node scripts/migrate.mjs

      - name: Build
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            export SENTRY_UPLOAD_SOURCEMAPS=1
          fi
          npm run build:worker

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        run: |
          npx -y @sentry/cli@3.8.2 sourcemaps inject .open-next/assets/_next/static
          npx -y @sentry/cli@3.8.2 sourcemaps upload --release "$NEXT_PUBLIC_SENTRY_RELEASE" .open-next/assets/_next/static

      # Never publish source maps (they'd expose the original source).
      - name: Remove source maps from the published assets
        run: find .open-next/assets -name '*.map' -delete

      - name: Waiting for setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, but skipping the deploy until the CLOUDFLARE_API_TOKEN secret is added (DEPLOY.md)."

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx opennextjs-cloudflare deploy

      - name: Smoke check production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/smoke.mjs https://portfoliorank.dev --moved-from https://portfoliorank.n8builds.dev

      # Each build keeps its ISR cache in its own folder of the R2 cache bucket,
      # and only the live build's is read; this removes all but the newest two
      # (scripts/prune-build-cache.mjs). A failure here never fails the deploy.
      - name: Remove old builds' ISR cache
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: node scripts/prune-build-cache.mjs
