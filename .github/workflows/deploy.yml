# Builds PortfolioRank with OpenNext and ships every push to main in two steps
# (DEPLOY.md "How a change ships"): the staging site first
# (https://staging.portfoliorank.n8builds.dev, wrangler.jsonc env.staging) and
# a smoke check there (scripts/smoke.mjs), then production, which is checked
# the same way right after its deploy. A failed staging deploy or check stops
# production.
# Run it by hand on a branch to put that branch on staging; production only
# ever deploys from main.
# The deploys skip with a notice until the CLOUDFLARE_API_TOKEN secret exists.
# The staging job skips until STAGING_TURSO_DATABASE_URL and
# STAGING_TURSO_AUTH_TOKEN exist, and production then deploys without it.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    name: Staging
    if: github.repository == 'n8watkins/portfolio-rank'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Staging's own database (a copy of production; DEPLOY.md "Staging"),
      # never the production TURSO_* secrets: the migration and the build's
      # prerender use these.
      TURSO_DATABASE_URL: ${{ secrets.STAGING_TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.STAGING_TURSO_AUTH_TOKEN }}
      SHOTS_BASE_URL: /shots
      # The Staging ribbon and the robots noindex tag (lib/site.ts IS_STAGING).
      NEXT_PUBLIC_SITE_ENV: staging
      # Browser errors reach Sentry tagged "staging" (no source maps upload).
      NEXT_PUBLIC_SENTRY_DSN: https://524f3d71051d8ad12f3dafce965d0ed4@o4507767562371072.ingest.us.sentry.io/4512375298523136
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}-staging
    steps:
      - name: Check the staging secrets
        id: setup
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping staging until the CLOUDFLARE_API_TOKEN, STAGING_TURSO_DATABASE_URL and STAGING_TURSO_AUTH_TOKEN secrets exist (DEPLOY.md \"Staging\")."
          fi

      - uses: actions/checkout@v7
        if: steps.setup.outputs.ready == 'true'

      - uses: actions/setup-node@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm

      - if: steps.setup.outputs.ready == 'true'
        run: npm ci

      # The additive migration production gets next, tried here first.
      - name: Migrate the staging database
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/migrate.mjs

      # Tiers by rank (lib/tiers.mjs): staging has no crons, so its tiers are placed at each deploy.
      - name: Place the staging tiers
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/refresh-tiers.mjs

      - name: Build
        if: steps.setup.outputs.ready == 'true'
        run: npm run build:worker

      # Never publish source maps (they'd expose the original source).
      - name: Remove source maps from the published assets
        if: steps.setup.outputs.ready == 'true'
        run: find .open-next/assets -name '*.map' -delete

      - name: Deploy to staging
        if: steps.setup.outputs.ready == 'true'
        run: npx opennextjs-cloudflare deploy --env staging

      - name: Smoke check staging
        if: steps.setup.outputs.ready == 'true'
        env:
          # Sent as X-Staging-Gate; the Cloudflare rule that locks staging lets it through.
          STAGING_GATE_KEY: ${{ secrets.STAGING_GATE_KEY }}
        run: node scripts/smoke.mjs https://staging.portfoliorank.n8builds.dev --staging

  deploy:
    name: Deploy
    needs: staging
    # Production deploys only from main; a run by hand on another branch
    # stops after staging.
    if: github.repository == 'n8watkins/portfolio-rank' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The home page is prerendered at build time (and kept fresh by ISR), so
      # the build reads the database and links screenshots like the live site.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      # Pages link captures on our own domain (wrangler.jsonc vars).
      SHOTS_BASE_URL: /shots
      # Browser errors go to Sentry (lib/error-reporting.ts). Only the deploy
      # builds set the DSN, so local, CI and test builds send nothing.
      NEXT_PUBLIC_SENTRY_DSN: https://524f3d71051d8ad12f3dafce965d0ed4@o4507767562371072.ingest.us.sentry.io/4512375298523136
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
      # Readable browser stack traces in Sentry: with the SENTRY_AUTH_TOKEN
      # secret and the SENTRY_ORG / SENTRY_PROJECT repository variables set,
      # the build emits source maps, uploads them and deletes them before the
      # deploy. Without them, nothing changes.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Additive schema changes (lib/schema.mjs) land before the code that
      # needs them (and before the build prerenders from the database),
      # instead of on a live request.
      - name: Migrate the database
        if: env.CLOUDFLARE_API_TOKEN != '' && env.TURSO_DATABASE_URL != ''
        run: node scripts/migrate.mjs

      # Tiers by rank (lib/tiers.mjs) placed before the new code serves; the hourly cron keeps them current.
      - name: Place the tiers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.TURSO_DATABASE_URL != ''
        run: node scripts/refresh-tiers.mjs

      - name: Build
        run: |
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            export SENTRY_UPLOAD_SOURCEMAPS=1
          fi
          npm run build:worker

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != '' && env.SENTRY_ORG != '' && env.SENTRY_PROJECT != ''
        run: |
          npx -y @sentry/cli@3.8.2 sourcemaps inject .open-next/assets/_next/static
          npx -y @sentry/cli@3.8.2 sourcemaps upload --release "$NEXT_PUBLIC_SENTRY_RELEASE" .open-next/assets/_next/static

      # Never publish source maps (they'd expose the original source).
      - name: Remove source maps from the published assets
        run: find .open-next/assets -name '*.map' -delete

      - name: Waiting for setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, but skipping the deploy until the CLOUDFLARE_API_TOKEN secret is added (DEPLOY.md)."

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx opennextjs-cloudflare deploy

      - name: Smoke check production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/smoke.mjs https://portfoliorank.n8builds.dev
