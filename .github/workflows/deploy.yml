# Builds PortfolioRank with OpenNext and deploys it to Cloudflare Workers after
# every push to main (DEPLOY.md). The build always runs; the deploy step skips
# with a notice until the CLOUDFLARE_API_TOKEN repository secret exists.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: github.repository == 'n8watkins/portfolio-rank'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The home page is prerendered at build time (and kept fresh by ISR), so
      # the build reads the database and links screenshots like the live site.
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      SHOTS_BASE_URL: ${{ secrets.SHOTS_BASE_URL }}
      # Browser errors go to Sentry (lib/error-reporting.ts). Only this build
      # sets the DSN, so local, CI and test builds send nothing.
      NEXT_PUBLIC_SENTRY_DSN: https://524f3d71051d8ad12f3dafce965d0ed4@o4507767562371072.ingest.us.sentry.io/4512375298523136
      NEXT_PUBLIC_SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:worker

      - name: Waiting for setup
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Built, but skipping the deploy until the CLOUDFLARE_API_TOKEN secret is added (DEPLOY.md)."

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx opennextjs-cloudflare deploy
