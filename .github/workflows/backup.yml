name: Backup DB to R2

# Snapshot every table the site needs (scripts/lib/snapshot.mjs) to R2 as
# gzipped JSON. Turso Free keeps only one day of point-in-time restore, so
# this is the real backup; the restore is scripts/restore-db.mjs
# (docs/ASSUMPTIONS.md section G).
# Snapshots go to the private portfolio-rank-backups bucket (no r2.dev access),
# with an R2 token scoped to that bucket only; never to the public screenshot
# bucket, since a snapshot holds every vote with its rater id.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code to run: empty for production's release, checkout for this branch, or one vX.Y.Z tag"
        required: false
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC (before the 06:00 sync)

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to file a failure issue

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: portfolio-rank-backups
    steps:
      - uses: actions/checkout@v7
      # Production runs the last release's code (.github/actions/release-code).
      - uses: ./.github/actions/release-code
        with:
          code: ${{ inputs.code }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require secrets
        run: |
          missing=
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN R2_ACCOUNT_ID R2_BACKUP_ACCESS_KEY_ID R2_BACKUP_SECRET_ACCESS_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
      - name: Snapshot DB to R2
        run: node scripts/backup-db.mjs

  # A job that fails, is cancelled or times out ends its own later steps, and
  # `if: failure()` is false for a cancelled or timed-out job (sync run
  # 43677044060 was cancelled at its 330-minute limit and filed nothing). So
  # the notice is a job of its own: always() runs it whatever happened to the
  # jobs it needs, and it reads their results.
  notify-failure:
    needs: [backup]
    if: ${{ always() && (needs.backup.result == 'failure' || needs.backup.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULTS: 'backup: ${{ needs.backup.result }}'
    steps:
      - name: File or update the failure issue
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again ($RESULTS): $url"
          else
            gh issue create --title "$title" --body "A scheduled run did not finish ($RESULTS): $url" >/dev/null
          fi
