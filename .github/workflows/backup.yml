name: Backup DB to R2

# Snapshot the irreplaceable Turso data (human votes, ELO ratings, and the
# expensive Gemini ai_rubric grades) to R2 as a gzipped JSON (~0.3 MB/run).
# Cheap insurance: the free-tier DB has no managed backups.
# Snapshots go to the private portfolio-rank-backups bucket (no r2.dev access),
# with an R2 token scoped to that bucket only; never to the public screenshot
# bucket, since a snapshot holds every vote with its rater id.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC (before the 06:00 sync)

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # to file a failure issue

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
      R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
      R2_BACKUP_BUCKET: portfolio-rank-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require secrets
        run: |
          missing=
          for v in TURSO_DATABASE_URL TURSO_AUTH_TOKEN R2_ACCOUNT_ID R2_BACKUP_ACCESS_KEY_ID R2_BACKUP_SECRET_ACCESS_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
      - name: Snapshot DB to R2
        run: node scripts/backup-db.mjs

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="⚠️ Scheduled job failed: ${{ github.workflow }}"
          url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search "$title" --json number,title \
            --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "A scheduled run failed: $url" >/dev/null
          fi
