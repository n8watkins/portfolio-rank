# release-kit: a new kit release arrives as update PRs (the dev dependency and the workflow pins).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: release-kit
    # Dependabot reads this git dependency's tags out of order and offered v2.0.0 -> v1.x
    # downgrades. Raise this floor with each new major of the kit.
    ignore:
      - dependency-name: release-kit
        versions: ["< 2.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: n8watkins/release-kit*
