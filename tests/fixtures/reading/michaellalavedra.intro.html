		:root {

		/* Start screen: who this is, what to do, and the one action that enters the site. */
		.start-screen {

		@keyframes drift {

			50% {
				transform: translate(20%, 20%) rotate(180deg);
			}
			100% {
				transform: translate(-20%, -20%) rotate(360deg);
			}
		}

		@media (prefers-reduced-motion: reduce) {
			.welcome,
			.start-btn::before,
			.ambient-glow {
				animation: none;
			}

				transition: background-color 0.2s ease;
			}

			.start-btn:active {
				transform: none;
			}
		}
